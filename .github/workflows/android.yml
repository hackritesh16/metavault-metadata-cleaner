name: Android APK Build

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      motion_smoke:
        description: Run the constrained Android emulator motion check
        type: boolean
        default: false

      viewer_smoke:
        description: Test advanced block viewing and export on Android
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaVault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Runs after the APK is uploaded, so a failing test turns the run red without hiding the APK.
      - name: Run unit tests
        run: gradle -p android testDebugUnitTest

  motion-smoke:
    name: Android emulator smoke test (API 29, two cores)
    if: github.event_name == 'workflow_dispatch' && (inputs.motion_smoke || inputs.viewer_smoke)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MetaVault-debug-apk
          path: apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          cores: 2
          ram-size: 1536M
          disable-animations: false
          script: |
            if [ "${{ inputs.motion_smoke }}" = "true" ]; then python3 android/qa/motion_smoke.py apk/app-debug.apk; fi
            if [ "${{ inputs.viewer_smoke }}" = "true" ]; then python3 android/qa/block_viewer_smoke.py apk/app-debug.apk; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-frame-stats
          path: motion-report/
          if-no-files-found: ignore
